name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      KEYD_VERSION: v2.6.0
      KEYD_COMMIT: 7c0aecb8bfd34dc8642bf4eefd2e59c89e61cec3
    steps:
      - uses: actions/checkout@v6
      - name: Install system build and Qt runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential libegl1
      - name: Build keyd syntax checker
        run: |
          git clone --depth 1 --branch "$KEYD_VERSION" \
            https://github.com/rvaiya/keyd.git /tmp/keyd
          test "$(git -C /tmp/keyd rev-parse HEAD)" = "$KEYD_COMMIT"
          make --directory /tmp/keyd
          echo "/tmp/keyd/bin" >> "$GITHUB_PATH"
          /tmp/keyd/bin/keyd --version
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -q KeydMapper/tests
      - name: Build distributions
        run: python -m build
