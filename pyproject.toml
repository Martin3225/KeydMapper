[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keydmapper"
version = "0.2.0"
description = "A visual editor for keyd configuration files"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Martin Vacek" },
]
dependencies = [
    "PySide6>=6.8,<7",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "pytest>=8.0.0",
    "pylint>=3.0",
]

[project.scripts]
keyd-mapper = "main:main"

[project.urls]
Homepage = "https://github.com/Martin3225/KeydMapper"
Issues = "https://github.com/Martin3225/KeydMapper/issues"
Source = "https://github.com/Martin3225/KeydMapper"

[tool.setuptools]
package-dir = { "" = "KeydMapper/src" }
py-modules = ["constants", "main"]

[tool.setuptools.packages.find]
where = ["KeydMapper/src"]

[tool.setuptools.package-data]
keyd = ["resources/*.layout"]
