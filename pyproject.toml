[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "keydmapper"
version = "0.1.0"
description = "A GUI desktop application for creating, editing, and managing keyd configuration files."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6==6.11.0",
    "PySide6_Addons==6.11.0",
    "PySide6_Essentials==6.11.0",
    "shiboken6==6.11.0",
    "pytest>=8.0.0",
    "pylint"
]

[project.scripts]
keyd-mapper = "main:main"

[tool.setuptools.package-dir]
"" = "KeydMapper/src"

[tool.setuptools.packages.find]
where = ["KeydMapper/src"]
